[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ta-benchgen"
version = "0.1.0"
description = "Benchmark generator for evaluating design flaw detection in OP-TEE trusted applications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "Flask>=3.0,<4", "requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
ta-bench = "ta_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ta_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["qemu: real Docker/OP-TEE validation; requires TA_BENCH_TEST_IMAGE"]

[tool.ruff]
line-length = 110
